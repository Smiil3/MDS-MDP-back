name: Deploy backend API

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mds-mdp-back:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Copy k8s manifests
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "k8s/*"
          target: "/root/backend-api"

      - name: Deploy on K3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            kubectl create namespace backend --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f /root/backend-api/k8s/deployment.yaml
            kubectl apply -f /root/backend-api/k8s/service.yaml
            kubectl apply -f /root/backend-api/k8s/ingress.yaml

            kubectl set image deployment/backend-api \
              backend-api=${{ env.IMAGE_NAME }}:${{ github.sha }} \
              -n backend

            kubectl rollout status deployment/backend-api -n backend